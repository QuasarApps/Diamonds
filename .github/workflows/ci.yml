name: CI

# Build the debug variant, run every module's JVM unit tests, and compile the
# instrumentation sources on each PR to develop (and on pushes to develop). This is
# the "real" green/red signal the tech-lead review's Track A calls for — before this,
# nothing actually compiled or ran the unit tests on a PR, and androidTest was not
# built at all (Track E).

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

# A newer commit on the same branch/PR supersedes in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.5 requires JDK 17 to run the build (project still targets JVM 11 bytecode).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # assembleDebug compiles all modules (incl. Hilt kapt + Compose) and the
      # manifest/resources; allUnitTests runs every module's testDebugUnitTest.
      - name: Build debug + run all unit tests
        run: ./gradlew assembleDebug allUnitTests --stacktrace

      # Compile (do NOT run) the instrumentation sources. Until this step existed,
      # app/src/androidTest was never built on a PR, so breakage there was invisible:
      # FakeRepositoryModule was silently missing an ISavedLocationRepository binding
      # — a Hilt graph error that only surfaces when androidTest is compiled.
      #
      # Limitation, deliberately accepted: this catches compile-time breakage only
      # (missing bindings, signature drift, unresolved references). It cannot catch a
      # failing *assertion* — e.g. a test asserting a string literal that a resource
      # rename changed — because that needs a real device/emulator. Running the 17
      # Compose test classes on an emulator is a separate, slower CI change.
      - name: Compile instrumentation tests
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Upload unit-test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 7
